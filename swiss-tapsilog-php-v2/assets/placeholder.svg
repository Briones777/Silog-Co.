  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="138" r="78" fill="url(#plate)" stroke="#e5d5b5" stroke-width="3"/>
  <circle cx="200" cy="138" r="62" fill="#fbf4e6" stroke="#eee0c6" stroke-width="2"/>
